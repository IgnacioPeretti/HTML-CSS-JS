<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUBZ0NE producciones | Dashboard</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
  href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@400;600;700&display=swap"
  rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="menu"></div>

  <main class="container mt-4">
    <h1 class="mb-3 titulo-fuente">Dashboard</h1>
    <p id="mensaje"></p>

    <!-- Tarjetas resumen -->
    <div id="resumen" class="row row-cols-2 row-cols-lg-4 g-3 mb-4"></div>

    <!-- Gráficos -->
    <div class="row g-4">
      <div class="col-12 col-lg-8">
        <div class="card card-body">
          <h5>Ocupación por evento</h5>
          <canvas id="grafico-ocupacion"></canvas>
        </div>
      </div>
      <div class="col-12 col-lg-4">
        <div class="card card-body">
          <h5>Estado de las entradas</h5>
          <canvas id="grafico-estados"></canvas>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/admin-dashboard.js"></script>
  
  <script>
    renderMenu();
  </script>
</body>
</html>
