<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cartelera</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="menu"></div>

  <main class="container mt-4">
    <h1 class="mb-3">Cartelera</h1>

    <div class="row g-2 mb-4">
      <div class="col-12 col-md-8">
        <input type="text" id="buscador" class="form-control" placeholder="Buscar evento por nombre..." />
      </div>
      <div class="col-12 col-md-4">
        <select id="filtro-categoria" class="form-select">
          <option value="">Todas las categorías</option>
        </select>
      </div>
    </div>

    <div id="cartelera" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/cartelera.js"></script>
  <script>
    renderMenu();
  </script>
</body>
</html>
