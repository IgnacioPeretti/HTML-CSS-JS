<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUBZ0NE producciones | Cartelera</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Fuente del banner  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Menú (lo dibuja menu.js, junto con las tiras y el pie) -->
  <div id="menu"></div>

  <!-- Banner -->
  <section class="hero">
    <div class="container">
      <p class="mb-1 text-uppercase small">SUBZ0NE producciones presenta</p>
      <h1>Próximos eventos</h1>
      <p>Elegí tu show y reservá tus entradas</p>
    </div>
  </section>

  <!-- Buscador, filtro y cartelera -->
  <main class="container">
    <div class="row g-2 mb-4">
      <div class="col-12 col-md-8">
        <input type="text" id="buscador" class="form-control" placeholder="Buscar evento por nombre..." />
      </div>
      <div class="col-12 col-md-4">
        <select id="filtro-categoria" class="form-select">
          <option value="">Todas las categorías</option>
        </select>
      </div>
    </div>

    <div id="cartelera" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/cartelera.js"></script>
  <script>
    renderMenu();
  </script>
</body>
</html>
