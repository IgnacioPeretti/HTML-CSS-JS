<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUBZ0NE producciones | Administrar eventos</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
  href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@400;600;700&display=swap"
  rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="menu"></div>

  <main class="container mt-4">
    <h1 class="mb-3 titulo-fuente">Administrar eventos</h1>

    <form id="form-evento" class="card card-body mb-4">
      <h5 id="titulo-form">Nuevo evento</h5>
      <input type="hidden" id="evento-id" />

      <div class="row g-2">
        <div class="col-12 col-md-6">
          <input type="text" id="titulo" class="form-control" placeholder="Título" required />
        </div>
        <div class="col-12 col-md-6">
          <input type="text" id="categoria" class="form-control" placeholder="Categoría" list="categorias" required />
          <datalist id="categorias">
            <option value="Recitales"></option>
            <option value="Teatro"></option>
            <option value="Conferencias"></option>
          </datalist>
        </div>
        <div class="col-12 col-md-4">
          <input type="date" id="fecha" class="form-control" required />
        </div>
        <div class="col-12 col-md-8">
          <input type="text" id="lugar" class="form-control" placeholder="Lugar" required />
        </div>
        <div class="col-6 col-md-4">
          <input type="number" id="precio" class="form-control" placeholder="Precio" min="0" required />
        </div>
        <div class="col-6 col-md-4">
          <input type="number" id="cupos" class="form-control" placeholder="Cupos" min="0" required />
        </div>
        <div class="col-12 col-md-4">
          <input type="url" id="imagen" class="form-control" placeholder="URL de la imagen" required />
        </div>
      </div>

      <p id="mensaje" class="mt-2 mb-2"></p>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" id="btn-guardar">Guardar</button>
        <button type="button" class="btn btn-secondary d-none" id="btn-cancelar">Cancelar edición</button>
      </div>
    </form>

    <div id="lista-eventos" class="table-responsive"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/admin-eventos.js"></script>
  <script>
    renderMenu();
  </script>
</body>
</html>
