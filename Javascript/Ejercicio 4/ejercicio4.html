<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ejercicio DOM - Manipulación de elementos</title>


  <style>
    body {
      font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial;
      max-width: 760px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .container {
      border: 1px solid #ddd;
      padding: 16px;
      border-radius: 8px;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin: 6px 0;
    }

    button {
      margin: 6px 8px 6px 0;
      cursor: pointer;
    }

    .log {
      background: #f6f8fa;
      border: 1px solid #e1e4e8;
      padding: 8px;
      border-radius: 6px;
      height: 120px;
      overflow: auto;
      font-family: monospace;
    }
  </style>
</head>

<body>
  <h1>Ejercicio DOM</h1>

  <div class="container">
    <h2>Lista de tareas</h2>

    <ul id="todo-list">
      <li id="item-1">Comprar carne</li>
      <li id="item-2">Pagar servicios</li>
      <li id="item-3">Enviar reporte</li>
    </ul>

    <div style="margin-top:12px">
      <button id="btn-add">Agregar tarea al final</button>
      <button id="btn-insert">Insertar antes de la segunda tarea</button>
      <button id="btn-replace">Reemplazar la primera tarea</button>
      <button id="btn-remove">Eliminar la última tarea </button>
    </div>

    <h3>Agregar tarea personalizada</h3>
    <input id="new-text" placeholder="Texto de la tarea" style="width:60%" />
    <button id="btn-add-custom">Agregar tarea</button>
    
    <h3>Registro de acciones</h3>
    <button id="btn-clear-log">Limpiar registro</button>
    <div id="log" class="log"></div>
  </div>

  <!-- Archivo JavaScript que deben crear los alumnos -->
  <script src="ejercicio4.js"></script>
</body>

</html>
