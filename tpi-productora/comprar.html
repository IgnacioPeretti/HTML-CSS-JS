<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUBZ0NE producciones | Comprar entradas</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="menu"></div>

  <main class="container mt-4" style="max-width: 600px">
    <h1 class="mb-3">Comprar entradas</h1>

    <div id="detalle-evento" class="mb-4"></div>

    <form id="form-compra" class="d-none">
      <label for="cantidad" class="form-label">Cantidad de entradas</label>
      <input type="number" id="cantidad" class="form-control mb-3" min="1" value="1" required />

      <p class="fs-5">Total: <strong id="total">$0</strong></p>

      <p id="mensaje"></p>
      <button class="btn btn-primary w-100">Confirmar compra</button>
    </form>

    <a href="index.html" class="d-block mt-3">← Volver a la cartelera</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/comprar.js"></script>
  <script>
    renderMenu();
  </script>
</body>
</html>
