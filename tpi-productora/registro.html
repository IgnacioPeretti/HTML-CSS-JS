<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUBZ0NE producciones | Registro</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="menu"></div>

  <main class="container auth-main">
    <form id="form-registro" class="auth-card">
      <h2 class="mb-3 titulo-fuente">Crear cuenta</h2>
      <input type="text" id="nombre" class="form-control mb-2" placeholder="Nombre completo" required />
      <input type="email" id="email" class="form-control mb-2" placeholder="Email" required />
      <input type="password" id="password" class="form-control mb-2" placeholder="Contraseña (mínimo 4 caracteres)" minlength="4" required />
      <p id="mensaje"></p>
      <button class="btn btn-primary w-100">Registrarme</button>
      <p class="text-center mt-3 mb-0 small">
        ¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a>
      </p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/registro.js"></script>
  <script>
    renderMenu();
  </script>
</body>
</html>
