<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUBZ0NE producciones | Administrar usuarios</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
  href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@400;600;700&display=swap"
  rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="menu"></div>

  <main class="container mt-4">
    <h1 class="mb-3 titulo-fuente">Administrar usuarios</h1>
    <p id="mensaje"></p>

    <div class="row g-4 mb-4">
      <!-- Crear usuario -->
      <div class="col-12 col-lg-7">
        <form id="form-usuario" class="card card-body h-100">
          <h5>Nuevo usuario</h5>
          <div class="row g-2">
            <div class="col-12 col-md-6">
              <input type="text" id="nombre" class="form-control" placeholder="Nombre completo" required />
            </div>
            <div class="col-12 col-md-6">
              <input type="email" id="email" class="form-control" placeholder="Email" required />
            </div>
            <div class="col-12 col-md-6">
              <input type="password" id="password" class="form-control" placeholder="Contraseña (mín. 4)" minlength="4" required />
            </div>
            <div class="col-12 col-md-6">
              <select id="role" class="form-select">
                <option value="USUARIO">USUARIO</option>
                <option value="ADMIN">ADMIN</option>
              </select>
            </div>
          </div>
          <button class="btn btn-primary mt-3">Crear usuario</button>
        </form>
      </div>

      <!-- Cambiar password -->
      <div class="col-12 col-lg-5">
        <form id="form-password" class="card card-body h-100">
          <h5>Cambiar contraseña</h5>
          <p id="usuario-seleccionado" class="text-muted">
            Elegí un usuario de la lista con el botón "Cambiar password".
          </p>
          <input type="hidden" id="password-id" />
          <input type="password" id="nueva-password" class="form-control mb-2" placeholder="Nueva contraseña (mín. 4)" minlength="4" required disabled />
          <button class="btn btn-warning" id="btn-password" disabled>Guardar nueva contraseña</button>
        </form>
      </div>
    </div>

    <div id="lista-usuarios" class="table-responsive"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/admin-usuarios.js"></script>
  <script>
    renderMenu();
  </script>
</body>
</html>
