<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Lenguaje HTML, ejemplos de Programación III">
    <meta name="author" content="Ignacio Peretti">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conferencia de Programación</title>
</head>

<body>

    <section>

        <article>

            <h1>Formulario de Registro</h1>

            <p>Principal | Fotos | Videos | Contacto</p>

            <form method="get" action="registro.jsp">

                <label for="nombre">Nombre:&nbsp;</label>
                <input type="text" id="nombre" name="nombre" maxlength="50">

                <br><br>

                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" maxlength="50">

                <br><br>

                <fieldset>
                    <legend>Sexo</legend>
                    <br>
                    <input type="radio" id="hombre" name="sexo" value="hombre">
                    <label for="hombre">Hombre</label>

                    <br><br>
                    
                    <input type="radio" id="mujer" name="sexo" value="mujer">
                    <label for="mujer">Mujer</label>

                    <br><br>
                    
                </fieldset>

                <br>

                <label for="correo">Correo:&nbsp;</label>
                <input type="email" id="correo" name="correo">

                <br><br>

                <input type="checkbox" id="novedades" name="novedades" checked>
                <label for="novedades"> Deseo recibir información sobre novedades y ofertas </label>

                <br><br>

                <input type="checkbox" id="condiciones" name="condiciones">
                <label for="condiciones"> Declaro haber leído y aceptar las condiciones generales del programa y la normativa sobre protección de datos </label>

                <br><br>

                <label for="ciudad">Ciudad:</label>

                <select id="ciudad" name="ciudad">
                    <option>Villa María</option>
                    <option>Villa Nueva</option>
                    <option>Córdoba cap</option>
                    <option>Río Cuarto</option>
                    <option>Río Tercero</option>
                </select>

                <br><br>

                <label for="temas">Temas sobre los que te gustaría debatir:</label>

                <br>

                <textarea id="temas" name="temas" cols="65" rows="5"></textarea>

                <br><br>

                <button type="submit">Enviar</button>

            </form>

        </article>

    </section>

</body>

</html>
